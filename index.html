<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ABS Ventures – Data Bundles</title>

<style>
:root{
  --bg:#0b0b0b;
  --card:#161616;
  --accent:#f5c400;
  --text:#ffffff;
  --muted:#9a9a9a;
  --success:#00e676;
}

*{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:20px;
  background:linear-gradient(135deg,#f5c400,#ff9100);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:22px;
  color:#000;
}

header h1{
  margin:12px 0 5px;
}

header p{
  color:var(--muted);
  font-size:14px;
}

.section{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  margin-bottom:20px;
}

.section h2{
  margin:0 0 14px;
  font-size:18px;
  color:var(--accent);
}

.bundle{
  background:#1f1f1f;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:2px solid transparent;
  cursor:pointer;
}

.bundle.active{
  border-color:var(--accent);
  background:#222;
}

.bundle span{
  font-size:15px;
}

input,button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  outline:none;
  margin-top:10px;
  font-size:15px;
}

input{
  background:#1f1f1f;
  color:white;
}

button{
  background:var(--accent);
  color:#000;
  font-weight:700;
  cursor:pointer;
}

.copy{
  background:#222;
  color:white;
  border:1px solid #333;
}

.success{
  color:var(--success);
  text-align:center;
  margin-top:12px;
  display:none;
}

footer{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-top:25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">ABS</div>
  <h1>ABS Ventures</h1>
  <p>Fast • Reliable • Affordable Data</p>
</header>

<div class="section">
  <h2>MTN Bundles</h2>
  <div class="bundle"><span>1GB</span><span>GHS 6</span></div>
  <div class="bundle"><span>2GB</span><span>GHS 11</span></div>
  <div class="bundle"><span>3GB</span><span>GHS 17</span></div>
  <div class="bundle"><span>4GB</span><span>GHS 23</span></div>
  <div class="bundle"><span>5GB</span><span>GHS 27</span></div>
</div>

<div class="section">
  <h2>Telecel Bundles</h2>
  <div class="bundle"><span>5GB</span><span>GHS 28</span></div>
  <div class="bundle"><span>10GB</span><span>GHS 46</span></div>
</div>

<div class="section">
  <h2>AirtelTigo Bundles</h2>
  <div class="bundle"><span>1GB</span><span>GHS 6</span></div>
  <div class="bundle"><span>2GB</span><span>GHS 12</span></div>
</div>

<div class="section">
  <h2>Payment</h2>
  <input type="text" placeholder="Recipient Number" />
  <button class="copy" onclick="copyMoMo()">Copy MoMo Number</button>
  <input type="file" />
  <button onclick="approve()">Submit Payment</button>
  <div class="success" id="success">✅ Payment submitted. Awaiting approval.</div>
</div>

<footer>
  WhatsApp Support: +233 202 111 485<br/>
  © 2026 ABS Ventures
</footer>

<script>
const bundles=document.querySelectorAll('.bundle');
bundles.forEach(b=>{
  b.onclick=()=>{
    bundles.forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  }
});

function copyMoMo(){
  navigator.clipboard.writeText("0202111485");
  alert("MoMo number copied");
}

function approve(){
  document.getElementById("success").style.display="block";
}
</script>

</body>
</html>
