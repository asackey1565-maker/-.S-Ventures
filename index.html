<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel's Data Hub</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --liquid-border: rgba(255, 255, 255, 0.2);
            --mtn-yellow: #FFCC00;
            --telecel-red: #E60000;
            --at-blue: #00AEEF;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #1a1a2e, #0f0f0f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 { margin-bottom: 5px; font-weight: 700; }
        .subtitle { color: #aaa; margin-bottom: 30px; }

        /* iOS 26 Liquid Glass Effect */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--liquid-border);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            /* Specular highlight simulation */
            background-image: radial-gradient(circle at top left, rgba(255,255,255,0.15) 0%, transparent 40%);
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .bundle-btn {
            background: rgba(40, 40, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            text-decoration: none;
            color: white;
        }

        .bundle-btn:active { transform: scale(0.95); }

        .gb-text { font-size: 1.2rem; font-weight: 800; display: block; }
        .price-text { font-size: 0.85rem; color: #ccc; }

        .mtn-text { color: var(--mtn-yellow); }
        .telecel-text { color: var(--telecel-red); }
        .at-text { color: var(--at-blue); }

        .footer { margin-top: 20px; text-align: center; font-size: 0.9rem; color: #777; }
    </style>
</head>
<body>

    <h1>Samuel Sackey</h1>
    <p class="subtitle">Premium Data Bundles (WhatsApp: 0202111485)</p>

    <div class="glass-card">
        <div class="category-title mtn-text">MTN Bundles</div>
        <div class="grid">
            <a href="https://wa.me/233202111485?text=Hi%20Samuel,%20I%20want%20MTN%201GB" class="bundle-btn">
                <span class="gb-text mtn-text">1GB</span> <span class="price-text">GHS 6</span>
            </a>
            <a href="https://wa.me/233202111485?text=Hi%20Samuel,%20I%20want%20MTN%202GB" class="bundle-btn">
                <span class="gb-text mtn-text">2GB</span> <span class="price-text">GHS 11</span>
            </a>
            <a href="https://wa.me/233202111485?text=Hi%20Samuel,%20I%20want%20MTN%203GB" class="bundle-btn">
                <span class="gb-text mtn-text">3GB</span> <span class="price-text">GHS 17</span>
            </a>
            <a href="https://wa.me/233202111485?text=Hi%20Samuel,%20I%20want%20MTN%205GB" class="bundle-btn">
                <span class="gb-text mtn-text">5GB</span> <span class="price-text">GHS 27</span>
            </a>
        </div>
    </div>

    <div class="glass-card">
        <div class="category-title telecel-text">Telecel Bundles</div>
        <div class="grid">
            <a href="https://wa.me/233202111485?text=Hi%20Samuel,%20I%20want%20Telecel%205GB" class="bundle-btn">
                <span class="gb-text telecel-text">5GB</span> <span class="price-text">GHS 28</span>
            </a>
            <a href="https://wa.me/233202111485?text=Hi%20Samuel,%20I%20want%20Telecel%2010GB" class="bundle-btn">
                <span class="gb-text telecel-text">10GB</span> <span class="price-text">GHS 46</span>
            </a>
        </div>
    </div>

    <div class="glass-card">
        <div class="category-title"><span class="telecel-text">Airtel</span><span class="at-text">Tigo</span> Bundles</div>
        <div class="grid">
            <a href="https://wa.me/233202111485?text=Hi%20Samuel,%20I%20want%20AT%201GB" class="bundle-btn">
                <span class="gb-text at-text">1GB</span> <span class="price-text">GHS 6</span>
            </a>
            <a href="https://wa.me/233202111485?text=Hi%20Samuel,%20I%20want%20AT%202GB" class="bundle-btn">
                <span class="gb-text at-text">2GB</span> <span class="price-text">GHS 12</span>
            </a>
        </div>
    </div>

    <div class="footer">
        © 2026 Samuel Sackey. Built with iOS 26 Liquid Glass Design.
    </div>

</body>
</html>
